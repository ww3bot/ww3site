<!DOCTYPE html><html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>Ticket Watcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Vazirmatn, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, #8ec5fc, transparent),
                  radial-gradient(1200px 600px at 90% 90%, #e0c3fc, transparent),
                  linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: grid;
      place-items: center;
      direction: rtl;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      padding: 24px 22px 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 22px;
      letter-spacing: .2px;
    }
    .field {
      margin-top: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      opacity: .8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      outline: none;
      font-size: 14px;
    }
    input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, #667eea, #5a67d8);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
}

.status {
  margin-top: 14px;
  text-align: center;
  min-height: 24px;
  font-size: 14px;
}

.success {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #16a34a;
  font-weight: 700;
  animation: pop .5s ease-out forwards;
}

.check {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid #16a34a;
  position: relative;
  animation: draw .6s ease-out forwards;
}
.check::after {
  content: '';
  position: absolute;
  left: 8px;
  top: 4px;
  width: 8px;
  height: 16px;
  border-right: 3px solid #16a34a;
  border-bottom: 3px solid #16a34a;
  transform: rotate(45deg) scale(0);
  animation: tick .4s ease-out .3s forwards;
}

@keyframes pop { from { transform: scale(.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes draw { from { transform: scale(.6); opacity: .4 } to { transform: scale(1); opacity: 1 } }
@keyframes tick { to { transform: rotate(45deg) scale(1) } }

.muted { opacity: .7 }
.error { color: #dc2626 }

  </style>
</head>
<body>
  <div class="card">
    <h1>بررسی موجودی بلیط</h1><div class="field">
  <label>لینک خرید بلیط</label>
  <input id="url" placeholder="https://example.com" />
</div>

<div class="field">
  <label>متن مورد نظر</label>
  <input id="text" placeholder="مثلاً: تعداد بلیط ها: 1" />
</div>

<div class="row field">
  <div>
    <label>هر چند ثانیه جستجو شود؟</label>
    <input id="intervalSec" type="number" min="1" value="10" />
  </div>
  <div>
    <label>وضعیت</label>
    <input disabled value="آماده" />
  </div>
</div>

<button onclick="startSearch()">شروع جستجو</button>

<div id="status" class="status muted"></div>

  </div>  <script>
    let timer = null;

    async function fetchAndSearch(url, text) {
      try {
        const res = await fetch(url);
        const html = await res.text();
        return html.includes(text);
      } catch (e) {
        return 'cors';
      }
    }

    function showSuccess() {
      const status = document.getElementById('status');
      status.className = 'status';
      status.innerHTML = `
        <div class="success">
          <div class="check"></div>
          <div>بلیط پیدا شد</div>
        </div>
      `;
    }

    function startSearch() {
      const url = document.getElementById('url').value.trim();
      const text = document.getElementById('text').value.trim();
      const sec = Math.max(1, Number(document.getElementById('intervalSec').value || 1));
      const status = document.getElementById('status');

      if (!url || !text) {
        status.className = 'status error';
        status.textContent = 'لطفاً لینک و متن را وارد کنید';
        return;
      }

      if (timer) clearInterval(timer);

      status.className = 'status muted';
      status.textContent = `در حال جستجو... هر ${sec} ثانیه`;

      timer = setInterval(async () => {
        const result = await fetchAndSearch(url, text);
        if (result === true) {
          clearInterval(timer);
          showSuccess();
        } else if (result === false) {
          status.className = 'status muted';
          status.textContent = 'هنوز پیدا نشد...';
        } else {
          clearInterval(timer);
          status.className = 'status error';
          status.textContent = '❌ سایت مقصد اجازه دسترسی نمی‌دهد (CORS)';
        }
      }, sec * 1000);
    }
  </script></body>
</html>
