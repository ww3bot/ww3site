<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تماس با من</title>
  <style>
    body {
      direction: rtl;
      font-family: sans-serif;
      max-width: 500px;
      margin: 50px auto;
    }
    textarea {
      width: 100%;
      height: 120px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>ارسال پیام</h2>

<textarea id="msg" placeholder="پیامت رو بنویس..."></textarea>
<button onclick="send()">ارسال</button>

<p id="status"></p>

<script>
async function send() {
  const msg = document.getElementById("msg").value;
  const status = document.getElementById("status");

  if (!msg) {
    status.innerText = "پیام خالیه";
    return;
  }

  status.innerText = "در حال ارسال...";

  try {
    const res = await fetch("ww3site-4fhbr6v9z-sinas-projects-b4517021.vercel.app", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });

    if (res.ok) {
      status.innerText = "✅ ارسال شد";
      document.getElementById("msg").value = "";
    } else {
      status.innerText = "❌ خطا در ارسال";
    }
  } catch {
    status.innerText = "❌ ارتباط برقرار نشد";
  }
}
</script>

</body>
</html>
